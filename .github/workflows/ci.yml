name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Go-сборка/тесты идут ВНУТРИ пиннутого образа golang:X-bookworm — того же,
  # что в Dockerfile каждого сервиса. Хост ubuntu-latest тут лишь Docker-host;
  # реальная работа — в воспроизводимом контейнере, matches prod build stage.
  go:
    name: build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-worker
            image: golang:1.25-bookworm   # == ai-worker/Dockerfile
          - service: enricher
            image: golang:1.24-bookworm   # == enricher/Dockerfile
          - service: sanitizer
            image: golang:1.24-bookworm   # == sanitizer/Dockerfile
          - service: backend
            image: golang:1.24-bookworm   # == backend/Dockerfile
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # container-job бежит от root, а checkout кладёт репо с другим uid →
      # git ругается "dubious ownership" и ломает VCS-штамп в go build.
      - name: mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo '::error::not gofmt-ed:'; gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race ./...

  # У UI своего тест-раннера нет, поэтому проверяем то, что реально ловит
  # поломки: типы и сборку бандла. Отдельный typecheck обязателен — `vite build`
  # типы не проверяет, esbuild их просто стирает, и ошибки копились незамеченными.
  ui:
    name: build & typecheck (ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: build
        run: npm run build

  # Линт Dockerfile'ов по чек-листу антипаттернов.
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - ai-worker/Dockerfile
          - enricher/Dockerfile
          - sanitizer/Dockerfile
          - backend/Dockerfile
          - ui/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  # Сама сборка образа, без пуша: release.yml бежит только по тегу, и без этой
  # проверки сломанный Dockerfile всплыл бы уже во время релиза.
  docker:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-worker, enricher, sanitizer, backend, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint ai-worker/chart
      - run: helm lint enricher/chart/incidentgpt-enricher
      - run: helm lint sanitizer/chart
      - run: helm lint backend/chart
      - run: helm lint ui/chart
      - run: helm lint deploy/redis
      # Зонтичный чарт линтуется только с собранными зависимостями.
      - run: helm dependency build deploy/incidentgpt
      - run: helm lint deploy/incidentgpt
      # Шаблоны должны не просто рендериться, а давать валидные манифесты.
      # kubeconform сверяет их со схемами Kubernetes офлайн: у kubectl схема
      # берётся из API-сервера, а кластера в раннере нет.
      - run: helm template incidentgpt deploy/incidentgpt > /tmp/render.yaml
      - name: kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          # Проверяем на нижнюю поддерживаемую версию: что валидно в 1.28,
          # то валидно и дальше, а обратное неверно.
          kubeconform -strict -summary -kubernetes-version 1.28.0 /tmp/render.yaml
