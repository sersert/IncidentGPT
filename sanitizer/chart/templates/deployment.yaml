apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentgpt-sanitizer.fullname" . }}
  labels:
    {{- include "incidentgpt-sanitizer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "incidentgpt-sanitizer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sanitizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "incidentgpt-sanitizer.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sanitizer
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "incidentgpt-sanitizer.fullname" . }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      containers:
        - name: sanitizer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: SANITIZER_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "incidentgpt-sanitizer.secretName" . }}
                  key: {{ .Values.secrets.hashKeySecretKey | quote }}
                  optional: true
            - name: SANITIZER_AUTH_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "incidentgpt-sanitizer.secretName" . }}
                  key: {{ .Values.secrets.authSharedSecretKey | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
