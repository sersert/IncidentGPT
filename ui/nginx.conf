server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Базовая авторизация на весь сайт: и статика, и API за одним входом.
    # Файл монтируется из Secret, логин и пароль задаются в values чарта.
    auth_basic "IncidentGPT";
    auth_basic_user_file /etc/nginx/secrets/htpasswd;

    # Проба готовности должна проходить без пароля, иначе kubelet получит 401
    # и под никогда не станет ready.
    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to backend
    location /api/ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $backend http://incidentgpt-backend.incidentgpt.svc.cluster.local:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Кто вошёл по basic-авторизации — бэкенд пишет это в журнал действий.
        proxy_set_header X-Auth-User $remote_user;
    }

    # Proxy WebSocket to backend
    location /ws/ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $backend http://incidentgpt-backend.incidentgpt.svc.cluster.local:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
