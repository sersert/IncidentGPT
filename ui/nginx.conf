map $request_method $login_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/incidentgpt/server.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Проба готовности должна проходить без пароля, иначе kubelet получит 401
    # и под никогда не станет ready.
    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /auth-config.json {
        auth_basic off;
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"mode":"${AUTH_MODE}"}';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/v1/auth/session {
        limit_req zone=login burst=${AUTH_LOGIN_BURST} nodelay;
        limit_req_status 429;
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        include /etc/nginx/incidentgpt/identity.conf;
    }

    location = /_session_check {
        internal;
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $backend ${BACKEND_URL};
        proxy_pass $backend/api/v1/auth/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        include /etc/nginx/incidentgpt/identity.conf;
    }

    # Proxy API to backend
    location ^~ /api/ {
        include /etc/nginx/incidentgpt/api.conf;
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Имя приходит из Basic-входа nginx или проверенной сессии backend.
        include /etc/nginx/incidentgpt/identity.conf;
    }

    # Proxy WebSocket to backend
    location ^~ /ws/ {
        include /etc/nginx/incidentgpt/api.conf;
        resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }

    # У скрипта начальной темы стабильный URL; он должен обновляться вместе с index.html.
    location = /theme-init.js {
        add_header Cache-Control "no-cache";
    }

    # Never route API paths with file extensions to the public asset handler.
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
