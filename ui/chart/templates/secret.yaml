{{- if .Values.auth.enabled }}
# Файл паролей для nginx. Пароль хэшируется bcrypt'ом на стороне шаблона,
# в кластер открытым текстом не попадает.
#
# Для продакшена лучше подложить свой Secret через auth.existingSecret —
# тогда пароль не будет лежать в values и в истории релизов Helm.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incidentgpt-ui.fullname" . }}-auth
  labels:
    {{- include "incidentgpt-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  htpasswd: {{ htpasswd .Values.auth.username .Values.auth.password | quote }}
{{- end }}
