{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-worker.fullname" . }}-secrets
  labels:
    {{- include "ai-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.openRouterApiKeyKey }}: {{ .Values.secretValues.openrouterApiKey | default "" | quote }}
  {{ .Values.secrets.telegramBotTokenKey }}: {{ .Values.secretValues.telegramBotToken | default "" | quote }}
  {{ .Values.secrets.sanitizerAuthSharedSecretKey }}: {{ .Values.secretValues.sanitizerAuthSharedSecret | default "" | quote }}
{{- end }}
