{{- if eq (toString .Values.env.EVALUATION_ENABLED) "true" }}
{{- if not .Values.secrets.existingSecret }}
{{- fail "EVALUATION_ENABLED requires secrets.existingSecret with analysis-service-token" }}
{{- end }}
{{- $profiles := mustFromJson (.Values.env.EVALUATION_PROFILES_JSON | default "[]") }}
{{- if or (lt (len $profiles) 1) (gt (len $profiles) 16) }}
{{- fail "evaluation requires 1-16 configured profiles" }}
{{- end }}
{{- end }}
{{- if and .Values.operations.enabled (not .Values.operations.existingSecret) }}
{{- fail "operations requires existingSecret" }}
{{- end }}
{{- if and .Values.operations.enabled (not .Values.operations.controlURL) }}
{{- fail "operations requires controlURL" }}
{{- end }}
{{- if and .Values.knowledgeMCP.enabled (not .Values.knowledgeMCP.existingSecret) }}
{{- fail "knowledgeMCP requires existingSecret" }}
{{- end }}
{{- if and .Values.knowledgeMCP.enabled (not .Values.knowledgeMCP.url) }}
{{- fail "knowledgeMCP requires url" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-worker.fullname" . }}
  labels:
    {{- include "ai-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-worker.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-worker.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      containers:
        - name: ai-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            {{- if .Values.operations.enabled }}
            - name: AI_CONTROL_URL
              value: {{ .Values.operations.controlURL | quote }}
            - name: OPERATIONS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operations.existingSecret }}
                  key: {{ .Values.operations.tokenKey }}
            {{- end }}
            {{- if .Values.knowledgeMCP.enabled }}
            - name: KNOWLEDGE_MCP_URL
              value: {{ .Values.knowledgeMCP.url | quote }}
            - name: KNOWLEDGE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.knowledgeMCP.existingSecret }}
                  key: {{ .Values.knowledgeMCP.tokenKey }}
            {{- end }}
            - name: ANALYSIS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "ai-worker.fullname" .)) .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.analysisServiceTokenKey }}
                  optional: {{ ne (toString .Values.env.EVALUATION_ENABLED) "true" }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "ai-worker.fullname" .)) .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.openRouterApiKeyKey | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "ai-worker.fullname" .)) .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.telegramBotTokenKey | quote }}
            - name: SANITIZER_AUTH_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "ai-worker.fullname" .)) .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.sanitizerAuthSharedSecretKey | quote }}
            {{- range $name, $value := .Values.env }}
            {{- if not (or (eq $name "AI_CONTROL_URL") (eq $name "OPERATIONS_SERVICE_TOKEN") (eq $name "OPENROUTER_API_KEY") (eq $name "TELEGRAM_BOT_TOKEN") (eq $name "SANITIZER_AUTH_SHARED_SECRET") (eq $name "KNOWLEDGE_MCP_URL") (eq $name "KNOWLEDGE_MCP_TOKEN")) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
