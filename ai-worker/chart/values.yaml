replicaCount: 1

image:
  repository: ghcr.io/sersert/incidentgpt-ai-worker
  tag: "0.2.0"
  pullPolicy: IfNotPresent

# Секрет для приватного registry (kubernetes.io/dockerconfigjson). Оставь пустым для публичного.
imagePullSecret: ""

fullnameOverride: "ai-worker"

service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"

resources: {}
#  requests:
#    cpu: 100m
#    memory: 128Mi
#  limits:
#    cpu: 500m
#    memory: 512Mi

# Секреты (переопредели при деплое через --set-file или внешний values).
# ВАЖНО: не коммить реальные ключи в этот файл!
secretValues:
  openrouterApiKey: ""
  telegramBotToken: ""
  sanitizerAuthSharedSecret: ""

secrets:
  # Optional existing Secret with OPENROUTER_API_KEY and TELEGRAM_BOT_TOKEN.
  # Empty value keeps the bundled Secret template and secretValues behavior.
  existingSecret: ""
  openRouterApiKeyKey: OPENROUTER_API_KEY
  telegramBotTokenKey: TELEGRAM_BOT_TOKEN
  sanitizerAuthSharedSecretKey: auth-shared-secret

env:
  LISTEN_ADDR: ":8080"
  LOG_LEVEL: "info"

  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1/chat/completions"
  OPENROUTER_MODEL: "google/gemini-2.5-flash"
  # reasoning-модели (gemini-2.5-flash) иногда думают дольше
  OPENROUTER_TIMEOUT_SECONDS: "300"
  OPENROUTER_MAX_TOKENS: "2000"  # reasoning-модели тратят токены и на "thinking" — не занижай

  # ID твоего канала (куда летят алерты) и linked-группы обсуждения. См. README.
  TELEGRAM_CHANNEL_ID: ""
  TELEGRAM_THREAD_CHAT_ID: ""
  TELEGRAM_PARSE_MODE: "Markdown"
  TELEGRAM_API_BASE_URL: "https://api.telegram.org"

  SANITIZER_URL: "http://incidentgpt-sanitizer.incidentgpt.svc:8080"
  SANITIZER_TIMEOUT_SECONDS: "3"

podAnnotations: {}

podLabels: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Prometheus ServiceMonitor (нужен Prometheus Operator / kube-prometheus-stack).
serviceMonitor:
  enabled: false
  interval: 30s
  # kube-prometheus-stack по умолчанию берёт ServiceMonitor'ы с меткой своего релиза.
  # Добавь её, напр. { release: kps }, иначе Prometheus не подхватит.
  additionalLabels: {}
