{{- $backend := index .Values "incidentgpt-backend" }}
{{- $ui := index .Values "incidentgpt-ui" }}
{{- if and $backend.enabled (not $ui.auth.existingSecret) (not $backend.changes.existingSecret) (eq $backend.readerAuth.existingSecret "incidentgpt-backend-reader") }}
# Share the existing UI account for independent backend verification. Production
# installs using external htpasswd should provide their own matching reader Secret.
apiVersion: v1
kind: Secret
metadata:
  name: incidentgpt-backend-reader
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: {{ $ui.auth.username | quote }}
  password: {{ $ui.auth.password | quote }}
{{- end }}
