apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: incidentgpt-sanitizer
  namespace: incidentgpt
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sanitizer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: enricher
      ports:
        - port: 8080
          protocol: TCP
