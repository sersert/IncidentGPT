{{- if and .Values.changes.durableCorrelation (or (lt (int .Values.redisStartup.timeoutSeconds) 5) (gt (int .Values.redisStartup.timeoutSeconds) 600)) }}
{{- fail "redisStartup.timeoutSeconds must be between 5 and 600" }}
{{- end }}
{{- if or .Values.topology.observationsEnabled .Values.topology.correlationEnabled }}
{{- if not .Values.changes.existingSecret }}
{{- fail "topology requires changes.existingSecret with the analysis service token" }}
{{- end }}
{{- if and .Values.topology.observationsEnabled (not .Values.topology.backendUrl) }}
{{- fail "topology observations require topology.backendUrl" }}
{{- end }}
{{- if and .Values.topology.correlationEnabled (not .Values.changes.durableCorrelation) }}
{{- fail "topology.correlationEnabled requires changes.durableCorrelation" }}
{{- end }}
{{- end }}
{{- if .Values.diagnostics.enabled }}
{{- if not .Values.changes.existingSecret }}
{{- fail "diagnostics.enabled requires changes.existingSecret with the analysis service token" }}
{{- end }}
{{- range (splitList "," .Values.diagnostics.namespaces) }}
{{- if not (trim .) }}
{{- fail "diagnostics.enabled requires diagnostics.namespaces with explicit nonempty namespace names" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (or .Values.operations.enabled (dig "operations" "enabled" false (.Values.global | default dict))) (not .Values.operations.existingSecret) }}
{{- fail "operations requires existingSecret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentgpt-enricher.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "incidentgpt-enricher.fullname" . }}
    app.kubernetes.io/component: "enricher"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "incidentgpt-enricher.fullname" . }}
      app.kubernetes.io/component: "enricher"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "incidentgpt-enricher.fullname" . }}
        app.kubernetes.io/component: "enricher"
    spec:
      serviceAccountName: {{ include "incidentgpt-enricher.fullname" . }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      containers:
        - name: enricher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9099
              name: http
          env:
            {{- if (or .Values.operations.enabled (dig "operations" "enabled" false (.Values.global | default dict))) }}
            - name: OPERATIONS_ENABLED
              value: "true"
            - name: OPERATIONS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operations.existingSecret }}
                  key: {{ .Values.operations.tokenKey }}
            {{- end }}
            {{- if .Values.changes.durableCorrelation }}
            - name: REDIS_STARTUP_TIMEOUT
              value: {{ printf "%ds" (int .Values.redisStartup.timeoutSeconds) | quote }}
            {{- end }}
            - name: TOPOLOGY_OBSERVATIONS_ENABLED
              value: {{ .Values.topology.observationsEnabled | quote }}
            - name: DEPENDENCY_CORRELATION_ENABLED
              value: {{ .Values.topology.correlationEnabled | quote }}
            - name: TOPOLOGY_BACKEND_URL
              value: {{ .Values.topology.backendUrl | quote }}
            - name: GUIDED_DIAGNOSTICS_ENABLED
              value: {{ .Values.diagnostics.enabled | quote }}
            - name: DIAGNOSTIC_NAMESPACES
              value: {{ .Values.diagnostics.namespaces | quote }}
            - name: DURABLE_CORRELATION_ENABLED
              value: {{ .Values.changes.durableCorrelation | quote }}
            {{- if .Values.changes.existingSecret }}
            - name: ANALYSIS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.changes.existingSecret }}
                  key: {{ .Values.changes.analysisServiceTokenKey }}
                  optional: {{ not (or .Values.diagnostics.enabled .Values.topology.observationsEnabled .Values.topology.correlationEnabled .Values.changes.durableCorrelation) }}
            {{- end }}
            - name: CHANGE_COLLECTOR_ENABLED
              value: {{ .Values.changes.enabled | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.changes.clusterId | default .Values.env.clusterName | quote }}
            - name: CHANGE_COLLECTOR_NAMESPACES
              value: {{ .Values.changes.namespaces | quote }}
            - name: CHANGE_BACKEND_URL
              value: {{ .Values.changes.backendUrl | quote }}
            - name: CHANGE_POLL_SECONDS
              value: {{ .Values.changes.pollSeconds | quote }}
            {{- if .Values.changes.existingSecret }}
            - name: CHANGE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.changes.existingSecret }}
                  key: {{ .Values.changes.ingestTokenKey }}
            {{- end }}
            - name: PROMETHEUS_URL
              value: {{ .Values.env.prometheusUrl | quote }}
            - name: PYTHON_BACKEND_URL
              value: {{ .Values.env.backendUrl | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.env.grafanaUrl | quote }}
            - name: LOGS_BASE_URL
              value: {{ .Values.env.logsBaseUrl | quote }}
            - name: RUNBOOK_BASE_URL
              value: {{ .Values.env.runbookBaseUrl | quote }}
            - name: LISTEN_ADDR
              value: {{ .Values.env.listenAddr | quote }}
            {{- if .Values.env.logsStoreUrl }}
            # Логи как слой обогащения. Без адреса шаг молча пропускается,
            # поэтому компонент остаётся рабочим и без хранилища логов.
            - name: LOGS_STORE_URL
              value: {{ .Values.env.logsStoreUrl | quote }}
            - name: LOGS_STORE_USER
              value: {{ .Values.env.logsStoreUser | default "" | quote }}
            - name: LOGS_STORE_INDEX
              value: {{ .Values.env.logsStoreIndex | default "logs-*" | quote }}
            {{- if .Values.logsStore.existingSecret }}
            - name: LOGS_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.logsStore.existingSecret }}
                  key: {{ .Values.logsStore.passwordKey | default "password" }}
            {{- end }}
            - name: LOGS_RANGE_BEFORE
              value: {{ .Values.env.logsRangeBefore | default "10m" | quote }}
            - name: LOGS_RANGE_AFTER
              value: {{ .Values.env.logsRangeAfter | default "2m" | quote }}
            - name: LOGS_MAX_LINES
              value: {{ .Values.env.logsMaxLines | default "40" | quote }}
            {{- end }}
            - name: ENRICHER_VERSION
              value: {{ .Values.env.enricherVersion | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.env.clusterName | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.env.environment | quote }}

            - name: PROM_RANGE_BEFORE
              value: {{ .Values.env.promRangeBefore | quote }}
            - name: PROM_RANGE_AFTER
              value: {{ .Values.env.promRangeAfter | quote }}

            - name: REDIS_ADDR
              value: {{ .Values.env.redisAddr | quote }}
            - name: REDIS_PASSWORD
              value: {{ .Values.env.redisPassword | quote }}
            - name: GROUP_BACKEND_URL
              value: {{ .Values.env.groupBackendUrl | quote }}
            - name: RAW_BACKEND_URL
              value: {{ .Values.env.rawBackendUrl | quote }}
            - name: SANITIZER_URL
              value: {{ .Values.env.sanitizerUrl | quote }}
            - name: SANITIZER_REQUEST_TIMEOUT
              value: {{ .Values.env.sanitizerRequestTimeout | quote }}
            - name: SANITIZER_AUTH_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "incidentgpt-enricher.fullname" .)) .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.sanitizerAuthSharedSecretKey | quote }}
            - name: CORR_WINDOW
              value: {{ .Values.env.corrWindow | quote }}
            - name: CORR_SETTLE
              value: {{ .Values.env.corrSettle | quote }}
            - name: RAW_DEDUP_TTL
              value: {{ .Values.env.rawDedupTtl | quote }}

            - name: ENRICH_CLUSTER_CONTEXT
              value: {{ .Values.env.enrichClusterContext | quote }}
            - name: ENRICH_NODE_CONTEXT
              value: {{ .Values.env.enrichNodeContext | quote }}
            - name: ENRICH_WORKLOAD_CONTEXT
              value: {{ .Values.env.enrichWorkloadContext | quote }}
            - name: ENRICH_EXTERNAL_CONTEXT
              value: {{ .Values.env.enrichExternalContext | quote }}
            - name: ENRICH_K8S_CONTEXT
              value: {{ .Values.env.enrichK8sContext | quote }}

            # путь до файла с метриками
            - name: METRICS_CONFIG_PATH
              value: "/etc/enricher/metrics.yaml"

          volumeMounts:
            - name: metrics-config
              mountPath: /etc/enricher
              readOnly: true

          {{- if .Values.changes.durableCorrelation }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: {{ div (add (int .Values.redisStartup.timeoutSeconds) 31) 2 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
{{ toYaml .Values.resources | indent 12 }}

      volumes:
        - name: metrics-config
          configMap:
            name: {{ include "incidentgpt-enricher.fullname" . }}-metrics
            items:
              - key: metrics.yaml
                path: metrics.yaml
