replicaCount: 1

image:
  repository: ghcr.io/sersert/incidentgpt-backend
  tag: "0.2.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Имя фиксировано: nginx в ui проксирует /api/ именно на incidentgpt-backend,
# а без override оно выводится из имени релиза и в зонтичном чарте разъезжается.
fullnameOverride: "incidentgpt-backend"

service:
  type: ClusterIP
  port: 8080

env:
  LISTEN_ADDR: ":8080"
  GUIDED_DIAGNOSTICS_ENABLED: "false"
  DIAGNOSTIC_COLLECTOR_URL: "http://incidentgpt-enricher:9099/v1/diagnostics"
  RUNBOOK_DIRECTORY: ""
  # Ручной перенос алертов включает общий composition lock; по умолчанию выключен.
  MANUAL_REGROUP_ENABLED: "false"
  # Без opt-in граф/карточка не требуют новой backend-авторизации.
  SERVICE_GRAPH_ENABLED: "false"
  # Полные доверенные Origin через запятую для прокси с заменой Host.
  ALLOWED_ORIGINS: ""
  DURABLE_ANALYSIS_ENABLED: "false"
  STRUCTURED_WORKER_URL: "http://ai-worker.incidentgpt.svc:8080/v1/analyze"
  CHANGES_ENABLED: "false"
  CHANGE_RETENTION_DAYS: "30"
  CHANGE_LOOKBACK: "2h"
  SANITIZER_URL: "http://incidentgpt-sanitizer.incidentgpt.svc:8080"
  TIMELINE_READ_USER: "admin"
  # Бэкенд стоит в разрыве группового пути: enricher шлёт группу сюда, мы строим
  # инцидент для UI и передаём тело дальше в ai-worker — тот же эндпоинт, что
  # enricher звал напрямую, поэтому разбор в Telegram работает как прежде.
  # Путь обязателен: без него форвард уходит в корень и получает 404.
  AI_WORKER_URL: "http://ai-worker.incidentgpt.svc:8080/incident-group"
  FORWARD_TO_AI_WORKER: "true"
  # Пусто — вкладка «Логи» просто не заполняется, см. docs/logs-enrichment.md
  LOGS_STORE_URL: ""
  LOGS_STORE_INDEX: "logs-*"
  # Инциденты и алерты живут в Redis: без него любой рестарт пода стирал историю.
  REDIS_ADDR: "incidentgpt-redis:6379"

# Разрешение bаckend → ai-worker. Политика самого ai-worker живёт в его чарте
# и пускает только enricher; здесь добавляем себя, не трогая чужой чарт.
networkPolicy:
  enabled: true
  uiAppLabel: incidentgpt-ui
  aiWorker:
    instance: incidentgpt
    name: ai-worker
    port: 8080

# Пароль к хранилищу логов подкладывается секретом, а не значением в values.
logsStore:
  existingSecret: ""
  passwordKey: password

# Общая administrator-учётка UI/backend; отдельной read-only роли пока нет.
changes:
  existingSecret: ""
  ingestTokenKey: change-ingest-token
  readerPasswordKey: timeline-read-password
  sanitizerSecretKey: auth-shared-secret
  analysisServiceTokenKey: analysis-service-token

runbooks:
  existingConfigMap: ""

serviceGraph:
  # ConfigMap с декларацией; при выборе чарт сам задаёт SERVICE_GRAPH_FILE.
  # В режиме файла PUT графа запрещён, чтобы фоновое чтение не откатывало правки API.
  existingConfigMap: ""
  key: dependencies.json
