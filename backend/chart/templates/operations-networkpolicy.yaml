{{- if and (or .Values.operations.enabled (dig "operations" "enabled" false (.Values.global | default dict))) .Values.networkPolicy.enabled .Values.operations.mcpNetworkPolicy.enabled .Values.operations.mcpHealthURL }}
# Явный opt-in: первая Ingress-политика изолирует выбранные MCP-поды.
# Предпочтительно настраивать все разрешённые клиенты в чарте самого MCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "incidentgpt-backend.fullname" . }}-operations-to-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: knowledge-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: {{ include "incidentgpt-backend.fullname" . }}
      ports:
        - protocol: TCP
          port: {{ .Values.operations.mcpPort }}
{{- end }}
