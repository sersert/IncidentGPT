{{- if eq (toString .Values.env.REPORTS_ENABLED) "true" }}
{{- if ne (toString .Values.env.DURABLE_ANALYSIS_ENABLED) "true" }}
{{- fail "REPORTS_ENABLED requires DURABLE_ANALYSIS_ENABLED=true" }}
{{- end }}
{{- if not .Values.changes.existingSecret }}
{{- fail "REPORTS_ENABLED requires changes.existingSecret with reader, analysis and sanitizer credentials" }}
{{- end }}
{{- end }}
{{- if and (eq (toString .Values.env.LEGACY_API_AUTH_REQUIRED) "true") (not .Values.changes.existingSecret) (not .Values.readerAuth.existingSecret) }}
{{- fail "LEGACY_API_AUTH_REQUIRED requires readerAuth.existingSecret or changes.existingSecret" }}
{{- end }}
{{- if and .Values.readerAuth.existingSecret .Values.changes.existingSecret }}
{{- fail "choose readerAuth.existingSecret or changes.existingSecret for backend reader credentials, not both" }}
{{- end }}
{{- if and (eq (toString .Values.env.MANUAL_REGROUP_ENABLED) "true") (ne (toString .Values.env.DURABLE_ANALYSIS_ENABLED) "true") }}
{{- fail "MANUAL_REGROUP_ENABLED requires DURABLE_ANALYSIS_ENABLED" }}
{{- end }}
{{- if eq (toString .Values.env.GUIDED_DIAGNOSTICS_ENABLED) "true" }}
{{- if ne (toString .Values.env.DURABLE_ANALYSIS_ENABLED) "true" }}
{{- fail "GUIDED_DIAGNOSTICS_ENABLED requires DURABLE_ANALYSIS_ENABLED=true" }}
{{- end }}
{{- if not .Values.changes.existingSecret }}
{{- fail "GUIDED_DIAGNOSTICS_ENABLED requires changes.existingSecret with reader, analysis and sanitizer credentials" }}
{{- end }}
{{- if not (.Values.env.DIAGNOSTIC_COLLECTOR_URL | default "" | trim) }}
{{- fail "GUIDED_DIAGNOSTICS_ENABLED requires env.DIAGNOSTIC_COLLECTOR_URL" }}
{{- end }}
{{- end }}
{{- if .Values.operations.enabled }}
{{- if not .Values.operations.existingSecret }}
{{- fail "operations requires existingSecret" }}
{{- end }}
{{- if not (or .Values.readerAuth.existingSecret .Values.changes.existingSecret) }}
{{- fail "operations requires backend reader credentials" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentgpt-backend.fullname" . }}
  labels:
    {{- include "incidentgpt-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "incidentgpt-backend.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "incidentgpt-backend.fullname" . }}
        {{- include "incidentgpt-backend.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.operations.enabled }}
            - name: OPERATIONS_ENABLED
              value: "true"
            - name: OPERATIONS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operations.existingSecret }}
                  key: {{ .Values.operations.tokenKey }}
            - name: OPERATIONS_WORKER_URL
              value: {{ .Values.operations.workerURL | quote }}
            - name: OPERATIONS_ENRICHER_URL
              value: {{ .Values.operations.enricherURL | quote }}
            - name: OPERATIONS_MCP_HEALTH_URL
              value: {{ .Values.operations.mcpHealthURL | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            {{- if not (or (hasPrefix "OPERATIONS_" $key) (and (eq $key "TIMELINE_READ_USER") $.Values.readerAuth.existingSecret (not $.Values.changes.existingSecret)) (and (eq $key "SERVICE_GRAPH_FILE") $.Values.serviceGraph.existingConfigMap)) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.readerAuth.existingSecret (not .Values.changes.existingSecret) }}
            - name: TIMELINE_READ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.readerAuth.existingSecret }}
                  key: {{ .Values.readerAuth.usernameKey }}
                  optional: false
            - name: TIMELINE_READ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.readerAuth.existingSecret }}
                  key: {{ .Values.readerAuth.passwordKey }}
                  optional: false
            {{- end }}
            {{- if .Values.serviceGraph.existingConfigMap }}
            - name: SERVICE_GRAPH_FILE
              value: /etc/incidentgpt/topology/dependencies.json
            {{- end }}
            {{- if .Values.logsStore.existingSecret }}
            # Пароль к хранилищу логов — из секрета: конфиг интеграций живёт в памяти
            # и после рестарта пода восстанавливается только из окружения.
            - name: LOGS_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.logsStore.existingSecret }}
                  key: {{ .Values.logsStore.passwordKey }}
            {{- end }}
            {{- if .Values.changes.existingSecret }}
            - name: ANALYSIS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.changes.existingSecret }}
                  key: {{ .Values.changes.analysisServiceTokenKey }}
                  optional: {{ ne (toString .Values.env.GUIDED_DIAGNOSTICS_ENABLED) "true" }}
            - name: CHANGE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.changes.existingSecret }}
                  key: {{ .Values.changes.ingestTokenKey }}
            - name: TIMELINE_READ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.changes.existingSecret }}
                  key: {{ .Values.changes.readerPasswordKey }}
            - name: SANITIZER_AUTH_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.changes.existingSecret }}
                  key: {{ .Values.changes.sanitizerSecretKey }}
            {{- end }}
          {{- if or .Values.runbooks.existingConfigMap .Values.serviceGraph.existingConfigMap }}
          volumeMounts:
            {{- if .Values.serviceGraph.existingConfigMap }}
            - name: service-graph
              mountPath: /etc/incidentgpt/topology
              readOnly: true
            {{- end }}
            {{- if .Values.runbooks.existingConfigMap }}
            - name: runbooks
              mountPath: /etc/incidentgpt/runbooks
              readOnly: true
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 75
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

      {{- if or .Values.runbooks.existingConfigMap .Values.serviceGraph.existingConfigMap }}
      volumes:
        {{- if .Values.serviceGraph.existingConfigMap }}
        - name: service-graph
          configMap:
            name: {{ .Values.serviceGraph.existingConfigMap }}
            items:
              - key: {{ .Values.serviceGraph.key | default "dependencies.json" | quote }}
                path: dependencies.json
        {{- end }}
        {{- if .Values.runbooks.existingConfigMap }}
        - name: runbooks
          configMap:
            name: {{ .Values.runbooks.existingConfigMap }}
        {{- end }}
      {{- end }}
