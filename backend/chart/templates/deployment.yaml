apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentgpt-backend.fullname" . }}
  labels:
    {{- include "incidentgpt-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "incidentgpt-backend.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "incidentgpt-backend.fullname" . }}
        {{- include "incidentgpt-backend.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.logsStore.existingSecret }}
            # Пароль к хранилищу логов — из секрета: конфиг интеграций живёт в памяти
            # и после рестарта пода восстанавливается только из окружения.
            - name: LOGS_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.logsStore.existingSecret }}
                  key: {{ .Values.logsStore.passwordKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
