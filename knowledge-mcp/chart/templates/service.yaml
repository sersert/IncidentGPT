apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-mcp.fullname" . }}
  labels:
    {{- include "knowledge-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: incidentgpt-knowledge-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
