{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "knowledge-mcp.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: incidentgpt-knowledge-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.workerAppLabel }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
